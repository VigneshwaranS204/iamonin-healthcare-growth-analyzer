version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iamonin_healthcare_growth_analyzer
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://iamonin:iamonin_secure_pass_2026@postgres:5432/iamonin_healthcare?schema=public
      - JWT_SECRET=iamonin-healthcare-growth-secret-key-2026-very-secure
      - CRAWL_MAX_PAGES=100
      - CRAWL_MAX_DEPTH=4
      - CRAWL_REQUEST_DELAY_MS=200
      - CRAWL_TIMEOUT_MS=15000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - reports_data:/app/backend/reports

  postgres:
    image: postgres:16-alpine
    container_name: iamonin_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=iamonin
      - POSTGRES_PASSWORD=iamonin_secure_pass_2026
      - POSTGRES_DB=iamonin_healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamonin -d iamonin_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  reports_data:
